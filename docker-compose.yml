version: '3.8'

name: lab12

services:
  postgres:
    image: postgres:17         
    container_name: postgres-lab
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: equipment_maintenance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: pgadmin-lab
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  web:
    container_name: web-lab
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
     - "8001:80"
    restart: unless-stopped

  api:
    container_name: api-lab
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
     - "8000:8000"
    environment:          
      PGHOST: postgres    
      PGPORT: 5432
      PGDATABASE: equipment_maintenance
      PGUSER: postgres
      PGPASSWORD: postgres
    restart: unless-stopped
    depends_on: 
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
  